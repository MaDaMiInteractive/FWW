    <head>
        <meta http-equiv="X-UA-Compatible" content="IE=9">
        <meta http-equiv="content-type" content="text/html; charset=UTF-8">

        <link rel="stylesheet" type="text/css" href="/orJSLibs/jQuery/jquery-ui.css" media="all" />
        <link rel="stylesheet" type="text/css" href="/orPrmCommon/baseScripts/widgets/orPrmSlider/orPrmSlider.css" />
        <link rel="stylesheet" type="text/css" href="/orPrmCommon/baseStyles/orPrime.css" /> 

        <link rel="stylesheet" type="text/css" href="/orJSLibs/dojo/dijit/themes/claro/claro.css" />
        <link rel="stylesheet" type="text/css" href="/orJSLibs/dojo/dojox/grid/resources/Grid.css" />
        <link rel="stylesheet" type="text/css" href="/orJSLibs/dojo/dojox/grid/resources/claroGrid.css" />

        <!--
        <style>
            .claro .dojoxGridHeader, .claro .dojoxGridHeader .dojoxGridCell {
            font-family: Tahoma;
            font-weight: normal;
            }
        </style>
        -->

        <style>
            #orPrmWebAppInfoPanelMsg {
                width : 95%; 
                float: left
            }
            #orPrmWebAppCoordsPanel {
                float: right;
                background-color: #cccccc;
                color: #000000;
                border: 2px solid #888888;
                padding-left: 3px;
                padding-right: 3px;
                padding-bottom: 1px;
            }
        </style>

        <script src="/orJSLibs/jQuery/jquery-1.7.1.min.js" type="text/javascript" charset="utf-8"></script>
        <script src="/orJSLibs/jQuery/jquery-ui.min.js" type="text/javascript" charset="utf-8"></script>
        <script src="/orJSLibs/dojo/dojo/dojo.js" type="text/javascript" data-dojo-config="async: false, isDebug: false, parseOnLoad: true"></script>

        <!--  include debugger -->
        <script src="/orPrmCommon/baseScripts/orPrmDebugger.js" type="text/javascript" ></script>

        <!--  include slider widget -->
        <script src="/orPrmCommon/baseScripts/orPrmJSLayerLoader.js" type="text/javascript" charset="utf-8"></script>
        <script src="/orPrmCommon/baseScripts/widgets/orPrmSlider/orPrmSlider.js" type="text/javascript" charset="utf-8"></script>

        <title>OrCAD Prime</title>

        <!-- DOJO requires -->
        <script>
            var orPrmWebApp = true;
            var appTheme = "claro";

            dojo.require("dijit.layout.BorderContainer");
            dojo.require("dijit.layout.TabContainer");
            dojo.require("dijit.layout.ContentPane");
            dojo.require("dijit.Tree");
            dojo.require("dijit.MenuBar");
            dojo.require("dijit.MenuBarItem");
            dojo.require("dijit.PopupMenuBarItem");
            dojo.require("dijit.Menu");
            dojo.require("dijit.MenuItem");
            dojo.require("dijit.PopupMenuItem");
            dojo.require("dijit.Toolbar");
            dojo.require("dijit.form.Button"); 
            dojo.require("dijit.ProgressBar");
            dojo.require("dijit.Dialog");
            dojo.require("dojo.store.Memory");
            dojo.require("dojo.data.ObjectStore");
            dojo.require("dojox.grid.DataGrid");
        </script>

        <!--  START Viewer Native Scripts -->
        <script type="text/javascript" src="/orPrmViewer/nativeJS/orPrmQTree.js"></script>
        <script type="text/javascript" src="/orPrmViewer/nativeJS/orPrmViewer.js"></script>
        <script type="text/javascript" src="/orPrmViewer/nativeJS/orPrmFieldMap.js"></script>
        <script type="text/javascript" src="/orPrmViewer/nativeJS/orPrmTestSystem.js"></script>
        <script type="text/javascript" src="/orPrmViewer/nativeJS/orPrmPinLib.js"></script>
        <!--  END Viewer Native scripts -->

        <!--  START Application Native scripts -->
        <script type="text/javascript" src="orPrmWebZoomer.js"></script>
        <script type="text/javascript" src="orPrmWebApp.js"></script>
        <script type="text/javascript" src="orPrmWebPropSys.js"></script>
        <!--  END Application Native scripts -->

        <link type="text/css" rel="stylesheet" href="orPrmWebApp.css">

        <script type="text/javascript">
            dojo.addOnLoad(
                function(){
                    var propGridDiv = 'propGrid';
                    orPrmInitPropView(propGridDiv)
                });

            function getContainerRect()
            {
                var width = $('#centerPanel').width();
                var height = $('#centerPanel').height();

                var ret = {
                    'uL' : {
                        'x' : 0,
                        'y' : 0
                    },
                    'lR' : {
                        'x' : width,
                        'y' : height
                    }
                };
                orPrmDebugger().log('Canvas container rect: ' + JSON.stringify(ret));
                return ret;
            }

            function orPrmPostLoad()
            {
                if(orPrmIsCanvasAware())
                    orPrmLoadWorkspace();
            }

            function orPrmPostModuleLoad()
            {
                // add property viewer callback
                orPrmAddCallback({eventType : 'OBJECT_SELECTION_EVENT', callback : orPrmDisplayObjectProps});
            }

            function initSystem()
            {
                if(orPrmIsCanvasAware())
                {
                    orPrmDebugger().enable();
                    orPrmInstallZoomer('zoomer', '#zoomWidget', '#zoomSlider', '#zoom');
                    orPrmLoadWorkspace();
                } 
                else 
                {
                    var msg = 'Your browser does not support HTML5 canvas feature. Unable to load OrCAD Prime Viewer.';
                    alert(msg);
                    $('#orPrmWebAppInfoPanelMsg').text(msg);
                }
            }

            $(
                function()
                {
                    initSystem();
                }
            );
        </script>

        <!-- load Prime -->
        <script type="text/javascript" src="/orPrmViewer/orcadprime/orcadprime.nocache.js"></script>
    </head>

    <body class='claro'>
        <div id="appLayout" class="containerLayout" data-dojo-type="dijit.layout.BorderContainer" data-dojo-props="design: 'headline'">
            <div data-dojo-type="dijit.layout.ContentPane" data-dojo-props="region:'top', splitter:false, border:'0px'">
                <div id="mast" class="mastHead">
                    <table width="100%">
                        <tbody>
                            <tr>
                                <td
                                    class="mastHead"
                                    style="vertical-align: bottom; font-size: 14px; font-weight: normal; line-height: 22px"><img
                                    alt="Prime Logo" src="/orPrmCommon/images/app.gif"
                                    style="float: left">&nbsp;OrCAD Prime</td>
                                <td
                                    class="mastHead"
                                    style="vertical-align: bottom; font-size: 14px; font-weight: normal; line-height: 22px"><img
                                    alt="Cadence Logo" src="/orPrmCommon/images/cadence.png"
                                    style="float: right"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <hr style="border: 1px solid #cc0000; margin-top: 0px; margin-bottom: 0px;"/>
                <!--                 <div id="menuBar"></div>  -->
                <div id="mainToolBar" dojoType="dijit.Toolbar">
                    <div dojoType="dijit.form.Button" id="mainToolBar.openDesign" iconClass="dijitFolderOpened" showLabel="false" onclick="orPrmLoadWorkspace()">
                        Open Workspace
                    </div>
                    <span dojoType="dijit.ToolbarSeparator"></span>
                    <div dojoType="dijit.form.Button" id="mainToolBar.print" iconClass="dijitEditorIcon dijitEditorIconPrint" showLabel="false">
                        Print
                    </div>
                    <div dojoType="dijit.form.Button" id="mainToolBar.viewStream" iconClass="dijitIconSample" showLabel="false" onclick="orPrmShowDataStream()">
                        View Stream
                    </div>
                </div> 
            </div>

            <div id="centerPanel" class="centerPanel" data-dojo-type="dijit.layout.TabContainer" data-dojo-props="region: 'center'">
                <div id="pageView"></div>
            </div>
            <div id="leftCol" class="edgePanel" data-dojo-type="dijit.layout.ContentPane" data-dojo-props="region: 'left', splitter: true">
                <div id="projTree">
                </div>
            </div>
            <div id="rightCol" class="edgePanel" data-dojo-type="dijit.layout.ContentPane" data-dojo-props="region: 'right', splitter: true" style="width: 345px">
                <div id="propGrid"></div>
            </div>
            <div style="background-color: #808080; color: #ffffff" class="edgePanel" data-dojo-type="dijit.layout.ContentPane" data-dojo-props="splitter: false, region: 'bottom'">
                <div id="orPrmWebAppStatusBar">
                <label id="orPrmWebAppInfoPanelMsg">Ready</label>
                <label id="orPrmWebAppCoordsPanel">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</label>
                </div>
            </div>
        </div>    
        <div id="wspaceDialog" data-dojo-type="dijit.Dialog" title="OrCAD Prime Workspace">
            <div data-dojo-type="dijit.layout.TabContainer" style="width: 500px; height: 300px;">
                <div id="wspaceDesigns" data-dojo-type="dijit.layout.ContentPane" title="Designs">
                </div>
                <div id="wspaceLibs" data-dojo-type="dijit.layout.ContentPane" title="Libraries">
                </div>
            </div>
        </div>
        <div id="dataStreamDialog" data-dojo-type="dijit.Dialog" title="OrCAD Prime Data Stream Viewer">
            <div id="dataStreamContentPane" data-dojo-type="dijit.layout.ContentPane" title="Designs">
            </div>
        </div>
        <div id="zoomWidget" title="Zoom Level">
            <input type="text" id="zoom" style="border: 0; color: #f6931f; font-weight: bold;" disabled="disabled" />
            <div id="zoomSlider"></div>
        </div>        
    </body>
</html>
