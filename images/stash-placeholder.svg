<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Stash placeholder</title>
  <desc id="desc">Stylized storage crate illustration for inventory and stash.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b1d12" />
      <stop offset="100%" stop-color="#120d08" />
    </linearGradient>
    <linearGradient id="crate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e6740" />
      <stop offset="100%" stop-color="#5c3f24" />
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b7a27b" />
      <stop offset="100%" stop-color="#7d6b4b" />
    </linearGradient>
  </defs>

  <rect width="640" height="640" rx="36" fill="url(#bg)" />
  <circle cx="520" cy="120" r="70" fill="#d18a2d" opacity="0.18" />
  <circle cx="120" cy="520" r="90" fill="#b44f1c" opacity="0.14" />

