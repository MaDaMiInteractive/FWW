    <rect x="200" y="180" width="60" height="90" rx="10" fill="url(#metal)" stroke="#4b3a22" stroke-width="8" />
    <rect x="85" y="95" width="24" height="220" fill="#3a2616" opacity="0.6" />
    <rect x="180" y="95" width="24" height="220" fill="#3a2616" opacity="0.6" />
    <rect x="276" y="95" width="24" height="220" fill="#3a2616" opacity="0.6" />
    <rect x="371" y="95" width="24" height="220" fill="#3a2616" opacity="0.6" />
    <rect x="100" y="25" width="260" height="28" rx="12" fill="url(#metal)" />
