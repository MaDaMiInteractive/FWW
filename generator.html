<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Генератор предметов FWW</title>

  <link rel="stylesheet" href="styles.css?v=1100" />
  <link rel="stylesheet" href="campaign.css?v=1100" />
</head>

<body>
  <header class="campaign-header" style="position:sticky;top:0;">
    <div class="campaign-header__row" style="align-items:center;">
      <a class="campaign-brand" href="index.html">Назад на главную</a>
      <div style="font-weight:800;font-size:1.1rem;">Генератор предметов FWW</div>
      <div style="margin-left:auto;color:var(--muted);font-size:13px;">Быстрый режим без сундука и кампании</div>
    </div>
  </header>

  <main class="campaign-content">
    <section class="panel-block">
      <div class="generator">
        <div class="generator__top">
          <div class="generator__weights">
            <div class="generator__weights-title">Вероятности выпадения (веса)</div>
            <div class="generator__weights-grid">
              <label class="wrow">
                <span class="dot dot--red"></span>
                <span>Красный</span>
                <input id="wRed" class="input number smallnum" type="number" min="0" value="5" />
              </label>
              <label class="wrow">
                <span class="dot dot--black"></span>
                <span>Черный</span>
                <input id="wBlack" class="input number smallnum" type="number" min="0" value="2" />
              </label>
              <label class="wrow">
                <span class="dot dot--green"></span>
                <span>Зеленый</span>
                <input id="wGreen" class="input number smallnum" type="number" min="0" value="1" />
              </label>
            </div>
            <div class="generator__weights-hint">Выберите тип предмета в одной из строк, затем нажмите «Сгенерировать предмет».</div>
          </div>

          <div class="generator__types">
            <div class="generator__types-title">Типы предметов</div>

            <div class="ig-rows">
              <div class="ig-row ig-row--red" data-rarity="red">
                <button class="ig-btn" data-type="Weapons" title="Оружие" aria-label="Оружие" type="button">
                  <svg class="ig-btn__icon" viewBox="0 0 64 64" aria-hidden="true"><use href="images/item-type-icons.svg#icon-weapon"></use></svg>
                </button>
                <button class="ig-btn" data-type="Armor" title="Броня" aria-label="Броня" type="button">
                  <svg class="ig-btn__icon" viewBox="0 0 64 64" aria-hidden="true"><use href="images/item-type-icons.svg#icon-armor"></use></svg>
                </button>
                <button class="ig-btn" data-type="Clothes" title="Одежда" aria-label="Одежда" type="button">
                  <svg class="ig-btn__icon" viewBox="0 0 64 64" aria-hidden="true"><use href="images/item-type-icons.svg#icon-clothes"></use></svg>
                </button>
                <button class="ig-btn" data-type="Alcohol" title="Алкоголь" aria-label="Алкоголь" type="button">
                  <svg class="ig-btn__icon" viewBox="0 0 64 64" aria-hidden="true"><use href="images/item-type-icons.svg#icon-alcohol"></use></svg>
                </button>
                <button class="ig-btn" data-type="Gear" title="Снаряжение" aria-label="Снаряжение" type="button">
                  <svg class="ig-btn__icon" viewBox="0 0 64 64" aria-hidden="true"><use href="images/item-type-icons.svg#icon-gear"></use></svg>
                </button>
                <button class="ig-btn" data-type="Junk" title="Хлам" aria-label="Хлам" type="button">
                  <svg class="ig-btn__icon" viewBox="0 0 64 64" aria-hidden="true"><use href="images/item-type-icons.svg#icon-junk"></use></svg>
                </button>
                <button class="ig-btn" data-type="Mods" title="Моды" aria-label="Моды" type="button">
                  <svg class="ig-btn__icon" viewBox="0 0 64 64" aria-hidden="true"><use href="images/item-type-icons.svg#icon-mods"></use></svg>
                </button>
                <button class="ig-btn" data-type="Food" title="Еда" aria-label="Еда" type="button">
                  <svg class="ig-btn__icon" viewBox="0 0 64 64" aria-hidden="true"><use href="images/item-type-icons.svg#icon-food"></use></svg>
                </button>
                <button class="ig-btn" data-type="Chems" title="Химия" aria-label="Химия" type="button">
                  <svg class="ig-btn__icon" viewBox="0 0 64 64" aria-hidden="true"><use href="images/item-type-icons.svg#icon-chems"></use></svg>
                </button>
                <button class="ig-btn" data-type="PowerArmor" title="Силовая броня" aria-label="Силовая броня" type="button">
                  <svg class="ig-btn__icon" viewBox="0 0 64 64" aria-hidden="true"><use href="images/item-type-icons.svg#icon-power-armor"></use></svg>
                </button>
              </div>

              <div class="ig-row ig-row--black" data-rarity="black">
                <button class="ig-btn" data-type="Weapons" title="Оружие" aria-label="Оружие" type="button">
                  <svg class="ig-btn__icon" viewBox="0 0 64 64" aria-hidden="true"><use href="images/item-type-icons.svg#icon-weapon"></use></svg>
                </button>
                <button class="ig-btn" data-type="Armor" title="Броня" aria-label="Броня" type="button">
                  <svg class="ig-btn__icon" viewBox="0 0 64 64" aria-hidden="true"><use href="images/item-type-icons.svg#icon-armor"></use></svg>
                </button>
                <button class="ig-btn" data-type="Clothes" title="Одежда" aria-label="Одежда" type="button">
                  <svg class="ig-btn__icon" viewBox="0 0 64 64" aria-hidden="true"><use href="images/item-type-icons.svg#icon-clothes"></use></svg>
                </button>
                <button class="ig-btn" data-type="Alcohol" title="Алкоголь" aria-label="Алкоголь" type="button">
                  <svg class="ig-btn__icon" viewBox="0 0 64 64" aria-hidden="true"><use href="images/item-type-icons.svg#icon-alcohol"></use></svg>
                </button>
                <button class="ig-btn" data-type="Gear" title="Снаряжение" aria-label="Снаряжение" type="button">
                  <svg class="ig-btn__icon" viewBox="0 0 64 64" aria-hidden="true"><use href="images/item-type-icons.svg#icon-gear"></use></svg>
                </button>
                <button class="ig-btn" data-type="Junk" title="Хлам" aria-label="Хлам" type="button">
                  <svg class="ig-btn__icon" viewBox="0 0 64 64" aria-hidden="true"><use href="images/item-type-icons.svg#icon-junk"></use></svg>
                </button>
                <button class="ig-btn" data-type="Mods" title="Моды" aria-label="Моды" type="button">
                  <svg class="ig-btn__icon" viewBox="0 0 64 64" aria-hidden="true"><use href="images/item-type-icons.svg#icon-mods"></use></svg>
                </button>
                <button class="ig-btn" data-type="Food" title="Еда" aria-label="Еда" type="button">
                  <svg class="ig-btn__icon" viewBox="0 0 64 64" aria-hidden="true"><use href="images/item-type-icons.svg#icon-food"></use></svg>
                </button>
                <button class="ig-btn" data-type="Chems" title="Химия" aria-label="Химия" type="button">
                  <svg class="ig-btn__icon" viewBox="0 0 64 64" aria-hidden="true"><use href="images/item-type-icons.svg#icon-chems"></use></svg>
                </button>
                <button class="ig-btn" data-type="PowerArmor" title="Силовая броня" aria-label="Силовая броня" type="button">
                  <svg class="ig-btn__icon" viewBox="0 0 64 64" aria-hidden="true"><use href="images/item-type-icons.svg#icon-power-armor"></use></svg>
                </button>
              </div>

              <div class="ig-row ig-row--green" data-rarity="green">
                <button class="ig-btn" data-type="Weapons" title="Оружие" aria-label="Оружие" type="button">
                  <svg class="ig-btn__icon" viewBox="0 0 64 64" aria-hidden="true"><use href="images/item-type-icons.svg#icon-weapon"></use></svg>
                </button>
                <button class="ig-btn" data-type="Armor" title="Броня" aria-label="Броня" type="button">
                  <svg class="ig-btn__icon" viewBox="0 0 64 64" aria-hidden="true"><use href="images/item-type-icons.svg#icon-armor"></use></svg>
                </button>
                <button class="ig-btn" data-type="Clothes" title="Одежда" aria-label="Одежда" type="button">
                  <svg class="ig-btn__icon" viewBox="0 0 64 64" aria-hidden="true"><use href="images/item-type-icons.svg#icon-clothes"></use></svg>
                </button>
                <button class="ig-btn" data-type="Alcohol" title="Алкоголь" aria-label="Алкоголь" type="button">
                  <svg class="ig-btn__icon" viewBox="0 0 64 64" aria-hidden="true"><use href="images/item-type-icons.svg#icon-alcohol"></use></svg>
                </button>
                <button class="ig-btn" data-type="Gear" title="Снаряжение" aria-label="Снаряжение" type="button">
                  <svg class="ig-btn__icon" viewBox="0 0 64 64" aria-hidden="true"><use href="images/item-type-icons.svg#icon-gear"></use></svg>
                </button>
                <button class="ig-btn" data-type="Junk" title="Хлам" aria-label="Хлам" type="button">
                  <svg class="ig-btn__icon" viewBox="0 0 64 64" aria-hidden="true"><use href="images/item-type-icons.svg#icon-junk"></use></svg>
                </button>
                <button class="ig-btn" data-type="Mods" title="Моды" aria-label="Моды" type="button">
                  <svg class="ig-btn__icon" viewBox="0 0 64 64" aria-hidden="true"><use href="images/item-type-icons.svg#icon-mods"></use></svg>
                </button>
                <button class="ig-btn" data-type="Food" title="Еда" aria-label="Еда" type="button">
                  <svg class="ig-btn__icon" viewBox="0 0 64 64" aria-hidden="true"><use href="images/item-type-icons.svg#icon-food"></use></svg>
                </button>
                <button class="ig-btn" data-type="Chems" title="Химия" aria-label="Химия" type="button">
                  <svg class="ig-btn__icon" viewBox="0 0 64 64" aria-hidden="true"><use href="images/item-type-icons.svg#icon-chems"></use></svg>
                </button>
                <button class="ig-btn" data-type="PowerArmor" title="Силовая броня" aria-label="Силовая броня" type="button">
                  <svg class="ig-btn__icon" viewBox="0 0 64 64" aria-hidden="true"><use href="images/item-type-icons.svg#icon-power-armor"></use></svg>
                </button>
              </div>
            </div>

            <div class="generator__actions">
              <button id="genOneBtn" class="btn" type="button">Сгенерировать предмет</button>
              <button id="clearBtn" class="btn danger" type="button">Очистить</button>
            </div>
          </div>
        </div>

        <div class="generator__results">
          <div class="generator__results-title">Сгенерированные карты</div>
          <div id="genResults" class="gen-grid"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="generator.js?v=1100"></script>
</body>

</html>
